name: Build & Release Desktop GUI (Linux & Windows)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            build_cmd: desktop:dist:linux
          - os: windows-latest
            platform: win
            build_cmd: desktop:dist:win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Apply Desktop & HiDPI Setup
        run: node scripts/apply-step1.mjs

      - name: Install Electron Packager
        run: npm install --no-save electron electron-builder

      - name: Build Desktop Binaries (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ matrix.build_cmd }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GodsEyeView-${{ matrix.platform }}-binaries
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
          if-no-files-found: warn

      - name: Publish Binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
